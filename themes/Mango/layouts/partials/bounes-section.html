<section style="padding: 60px 20px; font-family: system-ui, -apple-system, sans-serif; color: #fff;">
  
  <div style="max-width: 1200px; margin: 0 auto;">
    
    <!-- Heading -->
    <div style="text-align: center; margin-bottom: 50px;">
      <h2 style="font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 300; margin: 0 0 8px 0; letter-spacing: 0.5px; color: #1b1a1a;">
        Various bonuses
      </h2>
      <p style="font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 700; margin: 0; color: #f5d500;">
        Brought to you by JOJOBET!
      </p>
    </div>

    <!-- Two Column Layout -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; align-items: center; max-width: 1100px; margin: 0 auto;">

      <!-- Left: Image -->
      <div style="border-left: 6px solid #f5d500; border-bottom: 6px solid #f5d500; padding: 0 0 6px 6px; border-radius: 4px;">
        <img 
          src="https://via.placeholder.com/600x420/cccccc/333333?text=Bonus+Image" 
          alt="Various bonuses" 
          style="width: 100%; height: auto; display: block; border-radius: 2px;"
        >
      </div>

      <!-- Right: Content -->
      <div>
        <h3 style="font-size: clamp(1.4rem, 3vw, 1.75rem); font-weight: 700; margin: 0 0 20px 0; color: #000000; line-height: 1.3;">
          We are pleased to serve you with our valuable bonuses.
        </h3>
        
        <p style="font-size: 1rem; line-height: 1.7; color: #000000; margin: 0 0 30px 0;">
          Jojobet stands out with its unique bonuses! Our various bonuses are updated daily for you! Remember; bonus opportunities may be available for you at Jojobet!
        </p>

        <!-- View Bonuses Button -->
        <a 
          href="https://example.com/bonuses" 
          rel="nofollow" 
          target="_blank"
          class="bonus-btn"
          style="display: inline-block; padding: 12px 32px; background: #4caf50; color: #ffffff; font-size: 1rem; font-weight: 600; text-decoration: none; border-radius: 30px; box-shadow: 0 4px 14px rgba(76, 175, 80, 0.4); transition: all 0.25s ease;"
        >
          View Bonuses
        </a>
      </div>

    </div>
  </div>

  <!-- Hover + Responsive Styles -->
  <style>
    .bonus-btn:hover {
      background: #43a047 !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.65) !important;
    }

    .bonus-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(76, 175, 80, 0.5) !important;
    }

    @media (max-width: 600px) {
      .bonus-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>

</section>
