<footer class="site-footer" role="contentinfo" itemscope itemtype="https://schema.org/WPFooter" 
        style="background: var(--footer-bg); border-top: 1px solid var(--border); padding: 20px 0;">
  
  <div class="container" 
       style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;">

    <!-- Footer Links -->
    <div class="footer-links" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;">
      <a href="/" style="color: var(--text-light); text-decoration: none;">SuperTotoBet</a>
      <a href="/dmc" style="color: var(--text-light); text-decoration: none;">DMC</a>
    </div>

    <!-- Contact Email -->
    <div class="footer-contact" 
         style="color: var(--text-light); font-weight: bold; font-size: 15px;">
       👉 Contact: <a href="mailto:Contactnow50@gmail.com">Contactnow50@gmail.com</a>  
    </div>

    <!-- Copyright -->
    <div class="copyright" 
         style="color: var(--text-light); font-size: 14px;">
      &copy; <span itemprop="copyrightYear">{{ now.Format "2006" }}</span> 
      <span itemprop="copyrightHolder">{{ .Site.Title }}</span>. Her hakkı saklıdır.
    </div>

  </div>
</footer>
