<div class="tv-channels-section" itemscope itemtype="https://schema.org/ItemList">
  <h2 class="section-title" itemprop="name">Vistas previas del partido</h2>
  
  {{ $tvChannels := .Site.RegularPages }}
  
  <div class="tv-channels-grid" id="tvChannelsGrid">
    {{ range $index, $item := $tvChannels }}
      <div class="tv-channel-item{{ if ge $index 12 }} hidden-tv{{ end }}"
           itemprop="itemListElement"
           itemscope
           itemtype="https://schema.org/ListItem">
        
        {{ partial "post-card" $item }}

        <meta itemprop="position" content="{{ add $index 1 }}">
      </div>
    {{ end }}
  </div>

  {{ if gt (len $tvChannels) 12 }}
    <button id="loadMoreTv" class="load-more-btn">Load More</button>
  {{ end }}
</div>
